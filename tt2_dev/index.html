<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TT2 測試站 dev</title>
</head>
<body style="font-family:sans-serif; padding:24px; line-height:1.7;">
<p id="msg">轉址到測試站 dev …</p>
<script>
/* 測試站 dev 的入口：連到「測試用」中繼伺服器（不是正式的 taptitans2.onrender.com）。
   測試伺服器的網址在 config.js 設定；網頁主程式靠網址上的 env=dev 啟動測試環境隔離（資料與正式環境分開）。 */
</script>
<script src="config.js"></script>
<script>
(function () {
    var relay = (window.TT2_DEV_RELAY || '').replace(/\/$/, '');
    if (!relay || /taptitans2\.onrender\.com/i.test(relay)) {
        document.getElementById('msg').textContent = '尚未設定測試伺服器網址：請在 tt2_dev/config.js 填入測試伺服器的網址（不能是正式伺服器）。';
        return;
    }
    location.replace('../index.html?env=dev&relay=' + encodeURIComponent(relay));
})();
</script>
</body>
</html>
